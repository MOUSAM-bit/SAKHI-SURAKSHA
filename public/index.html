<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SakhiSuraksha SOS | Emergency Dispatcher</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f8fafc; margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        h1 { color: #dc2626; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #64748b; margin-top: 0; margin-bottom: 20px; }
        
        .status-bar { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 20px; font-size: 13px; }
        .badge { flex: 1; padding: 8px 12px; border-radius: 8px; background: #f1f5f9; text-align: center; font-weight: 600; }
        .badge.active { background: #dcfce7; color: #166534; }

        .sos-btn {
            width: 100%; padding: 22px; font-size: 20px; font-weight: bold; color: white;
            background: linear-gradient(135deg, #ef4444, #b91c1c); border: none; border-radius: 12px;
            cursor: pointer; box-shadow: 0 6px 20px rgba(220, 38, 38, 0.35); transition: transform 0.1s;
        }
        .sos-btn:active { transform: scale(0.98); }

        .voice-btn {
            width: 100%; margin-top: 12px; padding: 12px; font-size: 15px; font-weight: 600;
            background: #1e293b; color: white; border: none; border-radius: 10px; cursor: pointer;
        }
        .voice-btn.listening { background: #059669; animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.75; } 100% { opacity: 1; } }

        #alertBox { margin-top: 16px; padding: 14px; border-radius: 10px; display: none; font-size: 14px; line-height: 1.5; }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
        .alert-success { background: #dcfce7; color: #166534; border: 1px solid #4ade80; }

        hr { border: none; border-top: 1px solid #e2e8f0; margin: 25px 0; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
        .save-btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        .contact-card { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 12px; border-radius: 8px; margin-top: 10px; border: 1px solid #e2e8f0; }
        .del-btn { background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚨 SakhiSuraksha SOS</h1>
    <p class="subtitle">Voice-Activated Emergency Signal & Email Dispatcher</p>

    <div class="status-bar">
        <div id="gpsStatus" class="badge">📍 GPS: Locating...</div>
        <div id="voiceStatus" class="badge">🎙️ Voice Guard: Off</div>
    </div>

    <button class="sos-btn" onclick="triggerSOS('Manual SOS Button')">PRESS FOR EMERGENCY SOS</button>
    <button id="voiceToggleBtn" class="voice-btn" onclick="toggleVoiceRecognition()">🎙️ Enable Voice Trigger ("Help" / "Bachao" / "SOS")</button>

    <div id="alertBox"></div>

    <hr>

    <h3>Manage Emergency Contacts</h3>
    <input type="text" id="contactName" placeholder="Contact Name (e.g., Mom)">
    <input type="tel" id="contactPhone" placeholder="Phone Number (Optional)">
    <input type="email" id="contactEmail" placeholder="Email Address (Required for alerts)">
    <button class="save-btn" onclick="addContact()">Save Emergency Contact</button>

    <h3 style="margin-top: 25px;">Saved Emergency Contacts</h3>
    <div id="contactsList"></div>
</div>

<script>
    let currentLat = null;
    let currentLng = null;
    let isListening = false;
    let recognition = null;
    let sosCooldown = false;

    if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition(
            (pos) => {
                currentLat = pos.coords.latitude;
                currentLng = pos.coords.longitude;
                const gpsEl = document.getElementById('gpsStatus');
                gpsEl.textContent = `📍 GPS: Active (${currentLat.toFixed(4)}, ${currentLng.toFixed(4)})`;
                gpsEl.classList.add('active');
            },
            () => {
                document.getElementById('gpsStatus').textContent = '📍 GPS: Permission Denied';
            },
            { enableHighAccuracy: true }
        );
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-IN';

        recognition.onresult = (event) => {
            const transcript = Array.from(event.results)
                .map(result => result[0].transcript)
                .join(' ')
                .toLowerCase();

            document.getElementById('voiceStatus').textContent = `🎙️ Heard: "${transcript.slice(-25)}"`;

            const triggers = ['help', 'bachao', 'sos', 'emergency', 'save me'];
            if (triggers.some(word => transcript.includes(word)) && !sosCooldown) {
                sosCooldown = true;
                triggerSOS('Voice Trigger Detected');
                setTimeout(() => { sosCooldown = false; }, 10000);
            }
        };

        recognition.onend = () => {
            if (isListening) recognition.start();
        };
    }

    function toggleVoiceRecognition() {
        if (!recognition) {
            showAlert('Voice recognition is not supported in this browser. Please use Google Chrome.', true);
            return;
        }
        const btn = document.getElementById('voiceToggleBtn');
        const statusEl = document.getElementById('voiceStatus');

        if (!isListening) {
            isListening = true;
            recognition.start();
            btn.textContent = '🛑 Stop Voice Trigger Listener';
            btn.classList.add('listening');
            statusEl.textContent = '🎙️ Voice Guard: Listening...';
            statusEl.classList.add('active');
        } else {
            isListening = false;
            recognition.stop();
            btn.textContent = '🎙️ Enable Voice Trigger ("Help" / "Bachao" / "SOS")';
            btn.classList.remove('listening');
            statusEl.textContent = '🎙️ Voice Guard: Off';
            statusEl.classList.remove('active');
        }
    }

    async function triggerSOS(triggerType) {
        showAlert('⏳ Dispatching Emergency Signal & Email Alerts...', false);

        try {
            const response = await fetch('/api/sos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    latitude: currentLat,
                    longitude: currentLng,
                    triggerType
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.error || `Server error (${response.status})`);
            }

            showAlert(`✅ ${data.message}`, false);

        } catch (err) {
            showAlert(`❌ Error: ${err.message}`, true);
        }
    }

    async function loadContacts() {
        const res = await fetch('/api/contacts');
        const data = await res.json();
        const list = document.getElementById('contactsList');
        list.innerHTML = '';

        if (!data.contacts || data.contacts.length === 0) {
            list.innerHTML = '<p style="color:#64748b; font-size:14px;">No contacts added yet.</p>';
            return;
        }

        data.contacts.forEach(c => {
            list.innerHTML += `
                <div class="contact-card">
                    <div>
                        <strong>${c.name}</strong><br>
                        <small style="color:#475569;">✉️ ${c.email} | 📞 ${c.phone || 'N/A'}</small>
                    </div>
                    <button class="del-btn" onclick="deleteContact(${c.id})">Delete</button>
                </div>
            `;
        });
    }

    async function addContact() {
        const name = document.getElementById('contactName').value.trim();
        const phone = document.getElementById('contactPhone').value.trim();
        const email = document.getElementById('contactEmail').value.trim();

        const res = await fetch('/api/contacts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, phone, email })
        });
        const data = await res.json();

        if (!res.ok || !data.success) {
            showAlert(`❌ ${data.error}`, true);
            return;
        }

        document.getElementById('contactName').value = '';
        document.getElementById('contactPhone').value = '';
        document.getElementById('contactEmail').value = '';
        loadContacts();
    }

    async function deleteContact(id) {
        await fetch(`/api/contacts/${id}`, { method: 'DELETE' });
        loadContacts();
    }

    function showAlert(htmlMessage, isError) {
        const box = document.getElementById('alertBox');
        box.style.display = 'block';
        box.className = isError ? 'alert-error' : 'alert-success';
        box.innerHTML = htmlMessage;
    }

    loadContacts();
</script>

</body>
</html>
